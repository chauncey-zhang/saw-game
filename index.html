<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自动锯木箱 · 解压小机器</title>
<meta name="description" content="木头从履带送进封闭的锯木箱，嗡的一声，出口一次吐出四块木头。">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <header class="top">
    <div class="title">
      <h1>自动锯木箱</h1>
      <span class="sub">履带送料 · 箱内一锯 · 出口吐四块</span>
    </div>
    <div class="stats">
      <span class="pill">已出 <b id="outOut">0</b> 块</span>
      <span class="pill">已锯 <b id="logOut">0</b> 根</span>
      <span class="pill" id="woodTag">松木 · 好切</span>
    </div>
  </header>

  <section class="stage">
    <div class="wrap" id="wrap">
      <div id="scene" role="img" aria-label="自动锯木箱：木料由履带从左侧送入封闭箱体，箱内锯切后，右侧出口一次吐出四块木料"></div>
    </div>

    <div class="coach" id="coach">木头正在履带上进箱　·　按空格可暂停/继续</div>
    <div class="burst" id="tag" hidden>嗡——四块出炉</div>
  </section>

  <footer class="bottom">
    <div class="row">
      <span class="lab">木料</span>
      <span class="seg" role="group" aria-label="选择木料">
        <button type="button" data-wood="松木" data-grip="0.30" aria-pressed="true">松木</button>
        <button type="button" data-grip="0.50" data-wood="榉木" aria-pressed="false">榉木</button>
        <button type="button" data-wood="橡木" data-grip="0.72" aria-pressed="false">橡木</button>
      </span>
      <button type="button" class="btn" id="feedOne">再送一根</button>
      <button type="button" class="btn" id="autoToggle" aria-pressed="true" data-on="自动送料：开" data-off="自动送料：关">自动送料：开</button>
    </div>

    <div class="tune">
      <label class="field">切割力
        <input type="range" id="grip" min="0" max="1" step="0.02" value="0.3">
        <output id="gripVal">30%</output>
      </label>
      <label class="field">木屑
        <input type="range" id="dust" min="0" max="3" step="0.1" value="1.9">
        <output id="dustVal">1.9</output>
      </label>
      <label class="field">送料
        <input type="range" id="speed" min="0.5" max="2" step="0.05" value="1">
        <output id="speedVal">1.00x</output>
      </label>
      <span class="switches">
        <label class="switch"><input type="checkbox" id="sound" checked>机器声</label>
        <label class="switch"><input type="checkbox" id="haptics" checked>振动</label>
      </span>
    </div>

    <div class="row">
      <span class="lab"><span class="kbd">空格</span> 暂停　·　<span class="kbd">R</span> 重新开始</span>
      <button type="button" class="btn primary" id="resetAll">重新开始</button>
    </div>
  </footer>

</main>

<div hidden>
  <div id="prog" role="progressbar" aria-label="当前这根木头的进度"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div style="width:0%"></div></div>
  <span id="deep">进度 0%</span>
  <span id="feel">已锯 0 根 · 松木 · 好切</span>
</div>

<script src="i18n.js"></script>
<script src="saw.js"></script>
</body>
</html>
